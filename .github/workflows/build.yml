name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-28" "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build packages
        shell: pwsh
        run: ./scripts/package.ps1 -Abi all

      - name: Dump ModMenu header (debug)
        if: always()
        run: |
          H=$(find build-config -path "*/pl/ModMenu.hpp" 2>/dev/null | head -n1)
          if [ -z "$H" ]; then
            echo "ModMenu.hpp not found under build-config"
            find / -iname "ModMenu.hpp" 2>/dev/null
          else
            echo "=== $H ==="
            cat "$H"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: levilauncher-android-mod-template
          path: build-*/*.levipack

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-*/*.levipack
